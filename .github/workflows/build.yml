name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools"
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35"
          sdkmanager --sdk_root="$ANDROID_HOME" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Java:"
          java -version

          echo "SDK manager:"
          "$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --version

          echo "Installed packages:"
          "$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --list_installed

          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "Android SDK is ready!"

      # Buildozer expects the old tools/bin/sdkmanager path.
      # Redirect it to the modern cmdline-tools sdkmanager.
      - name: Create Buildozer SDK manager compatibility wrapper
        run: |
          mkdir -p "$ANDROID_HOME/tools/bin"

          cat > "$ANDROID_HOME/tools/bin/sdkmanager" <<'EOF'
          #!/bin/bash
          exec "$ANDROID_HOME/cmdline-tools/20.0/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "$@"
          EOF

          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "Buildozer sdkmanager wrapper:"
          cat "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "Testing Buildozer-compatible sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --list_installed

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer setuptools cython==0.29.34

      - name: Verify Buildozer
        run: |
          python --version
          buildozer --version
          cython --version

      - name: Connect Buildozer to Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sed -i '/^[[:space:]]*android\.sdk_path[[:space:]]*=.*/d' buildozer.spec
          sed -i "/^\[app\]/a android.sdk_path = $ANDROID_HOME" buildozer.spec

          echo "Configured Android SDK path:"
          grep "android.sdk_path" buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Favaran-Record-APK
          path: bin/*.apk
          if-no-files-found: error
